[workspace]
resolver = "2"
members = [
    "crates/dom-shim",
    "crates/readability-core",
    "crates/defuddle-core",
    "crates/bindings-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT AND Apache-2.0"

[workspace.dependencies]
scraper = "0.22"
ego-tree = "0.11"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
lazy_static = "1"
url = "2"
log = "0.4"
